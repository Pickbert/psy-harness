name: Windows Agent Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-release.yml"
      - "Agent/**"
      - "Sources/DesktopPet/Resources/**"
      - "ThirdParty/deepseek-harness/**"
      - "installer/**"
      - "scripts/build-windows-package.ps1"
      - "scripts/windows-agent-smoke.mjs"
      - "windows/**"
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: windows-agent-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

jobs:
  build-windows-agent:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24.13.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: Agent/windows-file-analysis/package-lock.json

      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath windows\VERSION -Raw).Trim()
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Git tag ${{ github.ref_name }} does not match windows/VERSION ($version)."
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test file analysis helper
        shell: pwsh
        working-directory: Agent/windows-file-analysis
        run: |
          npm ci --ignore-scripts --registry=https://registry.npmjs.org
          npm audit --omit=dev --registry=https://registry.npmjs.org
          npm test

      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          $uri = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri $uri -OutFile $installer
          $expectedHash = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Inno Setup SHA-256 mismatch: expected $expectedHash, got $actualHash."
          }
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Pyrsys B\.V\.") {
            throw "Inno Setup Authenticode verification failed: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed with exit code $($process.ExitCode)." }

          $languageUri = "https://raw.githubusercontent.com/jrsoftware/issrc/4adf37ed7f3fd2bd11c6836ba056e3de170fbabf/Files/Languages/Unofficial/ChineseSimplified.isl"
          $languageFile = Join-Path $env:RUNNER_TEMP "ChineseSimplified-6.7.3.isl"
          Invoke-WebRequest -Uri $languageUri -OutFile $languageFile
          $expectedLanguageHash = "7d544b9bb1d142cfa11f2e5d3cc8abe2e55f8e066c5124e3772675aa236e1278"
          $actualLanguageHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $languageFile).Hash.ToLowerInvariant()
          if ($actualLanguageHash -ne $expectedLanguageHash) {
            throw "ChineseSimplified.isl SHA-256 mismatch: expected $expectedLanguageHash, got $actualLanguageHash."
          }
          "INNO_CHINESE_LANGUAGE_FILE=$languageFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Import optional code-signing certificate
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            "thumbprint=" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "desktop-pet-signing.pfx"
          [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $securePassword = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          if (-not $certificate.Thumbprint) { throw "The signing certificate could not be imported." }
          "thumbprint=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Agent, installer, and portable package
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build-windows-package.ps1 -CreateInstaller -CreatePortableZip -SigningCertificateThumbprint "${{ steps.signing.outputs.thumbprint }}" -ChineseLanguageFile "%INNO_CHINESE_LANGUAGE_FILE%"

      - name: Verify release payload
        shell: pwsh
        run: |
          $base = "DesktopPet-Windows-v$env:APP_VERSION-Agent-x64"
          $installer = "build\$base-Setup.exe"
          $portable = "build\$base-Portable.zip"
          $checksums = "build\$base-SHA256SUMS.txt"
          foreach ($path in @($installer, $portable, $checksums)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing release file: $path" }
          }
          Get-Content -LiteralPath $checksums
          & "build\windows-agent-package-v$env:APP_VERSION\DesktopPetAgent\node.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Node runtime smoke test failed." }

      - name: Smoke-test plugin registry, portable parser, and installer
        shell: pwsh
        run: |
          $base = "DesktopPet-Windows-v$env:APP_VERSION-Agent-x64"
          $payload = "build\windows-agent-package-v$env:APP_VERSION"
          $workspace = Join-Path $env:RUNNER_TEMP "desktop-pet-file-analysis-smoke"
          New-Item -ItemType Directory -Path $workspace | Out-Null
          $source = Join-Path $workspace "smoke.txt"
          Set-Content -LiteralPath $source -Value "哈妮丝 Windows 文件解析 smoke test" -Encoding utf8NoBOM
          $request = @{ workspace = $workspace; files = @(@{ path = $source }) } | ConvertTo-Json -Depth 4 -Compress
          $events = $request | & "$payload\DesktopPetAgent\node.exe" "$payload\DesktopPetAgent\file-analysis\file-analysis.mjs"
          if ($LASTEXITCODE -ne 0 -or ($events -join "`n") -notmatch '"type":"completed"') {
            throw "Packaged file analysis smoke test failed: $($events -join ' ')"
          }

          $smokeScript = (Resolve-Path "scripts\windows-agent-smoke.mjs").Path
          $portableRoot = Join-Path $env:RUNNER_TEMP "desktop-pet-portable-smoke"
          Expand-Archive -LiteralPath "build\$base-Portable.zip" -DestinationPath $portableRoot
          $portableWorkspace = Join-Path $env:RUNNER_TEMP "desktop-pet-portable-agent-smoke"
          New-Item -ItemType Directory -Path $portableWorkspace | Out-Null
          & "$portableRoot\DesktopPetAgent\node.exe" $smokeScript `
            "$portableRoot\DesktopPetAgent" $portableWorkspace
          if ($LASTEXITCODE -ne 0) { throw "Portable Agent prompt smoke test failed." }

          $installer = Resolve-Path "build\$base-Setup.exe"
          $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer smoke test failed with exit code $($process.ExitCode)." }
          $installedRoot = Join-Path $env:LOCALAPPDATA "Programs\DesktopPet"
          foreach ($relativePath in @("DesktopPet-Windows-x64.exe", "DesktopPetAgent\node.exe", "DesktopPetAgent\file-analysis\file-analysis.mjs")) {
            if (-not (Test-Path -LiteralPath (Join-Path $installedRoot $relativePath) -PathType Leaf)) {
              throw "Installed package is incomplete; missing $relativePath."
            }
          }
          $installedWorkspace = Join-Path $env:RUNNER_TEMP "desktop-pet-installed-agent-smoke"
          New-Item -ItemType Directory -Path $installedWorkspace | Out-Null
          & "$installedRoot\DesktopPetAgent\node.exe" $smokeScript `
            "$installedRoot\DesktopPetAgent" $installedWorkspace
          if ($LASTEXITCODE -ne 0) { throw "Installed Agent prompt smoke test failed." }
          $uninstaller = Join-Path $installedRoot "unins000.exe"
          $process = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller smoke test failed with exit code $($process.ExitCode)." }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopPet-Windows-v${{ env.APP_VERSION }}-Agent-x64
          retention-days: 14
          path: |
            build/DesktopPet-Windows-v${{ env.APP_VERSION }}-Agent-x64-Setup.exe
            build/DesktopPet-Windows-v${{ env.APP_VERSION }}-Agent-x64-Portable.zip
            build/DesktopPet-Windows-v${{ env.APP_VERSION }}-Agent-x64-SHA256SUMS.txt
          if-no-files-found: error

  build-macos-agent:
    if: ${{ github.ref_type == 'tag' }}
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24.13.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1

      - name: Enable Corepack
        run: corepack enable

      - name: Verify release version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < windows/VERSION)"
          if [[ "${{ github.ref_name }}" != "v$version" ]]; then
            echo "Git tag ${{ github.ref_name }} does not match windows/VERSION ($version)." >&2
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build bundled Agent runtime
        env:
          COREPACK_NPM_REGISTRY: https://registry.npmjs.org
          npm_config_registry: https://registry.npmjs.org
        run: ./scripts/build-agent-runtime.sh

      - name: Run Swift tests
        run: swift test --disable-sandbox --jobs 1

      - name: Build signed application bundle
        env:
          DESKTOPPET_REQUIRE_AGENT_RUNTIME: "1"
          DESKTOPPET_SWIFT_JOBS: "1"
        run: ./scripts/build-app.sh release

      - name: Verify and package macOS application
        shell: bash
        run: |
          app="build/DesktopPet.app"
          base="PsyPet-macOS-v$APP_VERSION-Agent-arm64"
          archive="build/$base.zip"
          checksums="build/$base-SHA256SUMS.txt"
          test -x "$app/Contents/MacOS/DesktopPet"
          test -x "$app/Contents/Helpers/DesktopPetAgent"
          test -x "$app/Contents/Helpers/DesktopPetAgent-spawn-helper"
          file "$app/Contents/MacOS/DesktopPet" | grep -q arm64
          file "$app/Contents/Helpers/DesktopPetAgent" | grep -q arm64
          codesign --verify --deep --strict "$app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")" = "$APP_VERSION"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          shasum -a 256 "$archive" | sed 's#  build/#  #' > "$checksums"
          unzip -t "$archive"

      - name: Smoke-test packaged macOS Agent
        shell: bash
        run: |
          extract="$RUNNER_TEMP/psypet-macos-release-smoke"
          ditto -x -k "build/PsyPet-macOS-v$APP_VERSION-Agent-arm64.zip" "$extract"
          codesign --verify --deep --strict "$extract/DesktopPet.app"
          node scripts/windows-agent-smoke.mjs \
            "$extract/DesktopPet.app/Contents" \
            "$RUNNER_TEMP/psypet-macos-agent-workspace"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PsyPet-macOS-v${{ env.APP_VERSION }}-Agent-arm64
          retention-days: 14
          path: |
            build/PsyPet-macOS-v${{ env.APP_VERSION }}-Agent-arm64.zip
            build/PsyPet-macOS-v${{ env.APP_VERSION }}-Agent-arm64-SHA256SUMS.txt
          if-no-files-found: error

  publish-release:
    if: ${{ github.ref_type == 'tag' }}
    needs:
      - build-windows-agent
      - build-macos-agent
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release-assets
          gh release create "${{ github.ref_name }}" \
            release-assets/* \
            --verify-tag \
            --generate-notes \
            --title "哈妮丝 ${{ github.ref_name }}"
